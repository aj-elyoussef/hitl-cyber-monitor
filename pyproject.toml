[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-cyber-monitor"
version = "0.1.0"
description = "AI-assisted, human-approved cybersecurity monitor with allowlisted remediation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad Jamal El-Youssef" }]
dependencies = [
    "anthropic>=2.0,<3",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.16.9,<0.17"]

[project.scripts]
hitl-monitor = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# UP042: keep (str, Enum) because StrEnum needs Python 3.11.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, fake tokens and hostile sample strings.
"tests/**" = ["S101", "S104", "S105", "S106"]
